openapi: 3.0.3
info:
  title: SmartBooking API
  version: 1.0.0
  description: |
    SmartBooking 預約型服務平台 REST API（JSON）。

    重要原則：
    - 伺服器端強制 RBAC（Guest/User/Provider/Admin）
    - 預約建立/取消需交易一致性，並在高併發下避免超賣
    - 失敗回應使用一致格式，並回傳 requestId 便於追蹤
servers:
  - url: http://localhost:3000

tags:
  - name: Auth
  - name: Public
  - name: User
  - name: Provider
  - name: Admin

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: 註冊（User/Provider 擇一）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: 註冊成功並回傳 access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/login:
    post:
      tags: [Auth]
      summary: 登入
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登入成功並回傳 access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/logout:
    post:
      tags: [Auth]
      summary: 登出
      security:
        - bearerAuth: []
      responses:
        '204':
          description: 登出成功（不回傳 body）
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/password-reset/request:
    post:
      tags: [Auth]
      summary: 忘記密碼（要求寄送重設連結）
      description: |
        為避免帳號枚舉，本操作無論 email 是否存在都回傳 202。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: 已接受請求（不保證 email 存在或寄送成功）

  /auth/password-reset/confirm:
    post:
      tags: [Auth]
      summary: 重設密碼（使用一次性 token）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '200':
          description: 重設成功
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /services:
    get:
      tags: [Public]
      summary: 服務列表（公開瀏覽）
      responses:
        '200':
          description: 服務清單（Guest/User/Provider 僅回 ACTIVE）
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Service'

  /services/{serviceId}:
    get:
      tags: [Public]
      summary: 服務詳情 + 時段列表
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 服務與時段
          content:
            application/json:
              schema:
                type: object
                required: [service, timeSlots]
                properties:
                  service:
                    $ref: '#/components/schemas/Service'
                  timeSlots:
                    type: array
                    items:
                      $ref: '#/components/schemas/TimeSlot'
        '404':
          $ref: '#/components/responses/NotFound'

  /bookings:
    post:
      tags: [User]
      summary: 建立預約（僅 User）
      security:
        - bearerAuth: []
      description: |
        - 僅允許 User 建立
        - 需檢查：TimeSlot OPEN、Service ACTIVE、未超過可預約邊界（如有）、剩餘名額、是否重複預約
        - 需保證不超賣（高併發）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
      responses:
        '200':
          description: 建立成功
          content:
            application/json:
              schema:
                type: object
                required: [booking]
                properties:
                  booking:
                    $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /me/bookings:
    get:
      tags: [User]
      summary: 我的預約列表（僅 User）
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 我的預約
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /bookings/{bookingId}/cancel:
    post:
      tags: [User]
      summary: 取消預約（僅 User，且需在截止時間前）
      security:
        - bearerAuth: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 取消成功
          content:
            application/json:
              schema:
                type: object
                required: [booking]
                properties:
                  booking:
                    $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /provider/services:
    post:
      tags: [Provider]
      summary: 建立服務（僅 Provider）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceRequest'
      responses:
        '200':
          description: 建立成功
          content:
            application/json:
              schema:
                type: object
                required: [service]
                properties:
                  service:
                    $ref: '#/components/schemas/Service'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /provider/services/{serviceId}:
    patch:
      tags: [Provider]
      summary: 更新/停用服務（僅 Provider，且只能操作自己的）
      security:
        - bearerAuth: []
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateServiceRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                required: [service]
                properties:
                  service:
                    $ref: '#/components/schemas/Service'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /provider/services/{serviceId}/time-slots:
    post:
      tags: [Provider]
      summary: 建立時段（僅 Provider）
      security:
        - bearerAuth: []
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTimeSlotRequest'
      responses:
        '200':
          description: 建立成功
          content:
            application/json:
              schema:
                type: object
                required: [timeSlot]
                properties:
                  timeSlot:
                    $ref: '#/components/schemas/TimeSlot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /provider/time-slots/{timeSlotId}:
    patch:
      tags: [Provider]
      summary: 更新/關閉時段（僅 Provider）
      security:
        - bearerAuth: []
      parameters:
        - name: timeSlotId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTimeSlotRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                required: [timeSlot]
                properties:
                  timeSlot:
                    $ref: '#/components/schemas/TimeSlot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /provider/time-slots/{timeSlotId}/bookings:
    get:
      tags: [Provider]
      summary: 查看時段預約名單（僅 Provider）
      security:
        - bearerAuth: []
      parameters:
        - name: timeSlotId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 預約名單
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /provider/bookings/{bookingId}/complete:
    post:
      tags: [Provider]
      summary: 標記預約完成（僅 Provider）
      security:
        - bearerAuth: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                required: [booking]
                properties:
                  booking:
                    $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /provider/bookings/{bookingId}/cancel:
    post:
      tags: [Provider]
      summary: 服務方取消預約（僅 Provider）
      security:
        - bearerAuth: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                required: [booking]
                properties:
                  booking:
                    $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin/users:
    get:
      tags: [Admin]
      summary: 使用者列表（僅 Admin）
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 使用者清單
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/users/{userId}:
    patch:
      tags: [Admin]
      summary: 更新帳號狀態（ACTIVE/SUSPENDED）（僅 Admin）
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatusRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/services:
    get:
      tags: [Admin]
      summary: 服務列表（含非 ACTIVE）（僅 Admin）
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 服務清單
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Service'

  /admin/services/{serviceId}:
    patch:
      tags: [Admin]
      summary: 更新服務狀態（ACTIVE/INACTIVE）（僅 Admin）
      security:
        - bearerAuth: []
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateServiceStatusRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                required: [service]
                properties:
                  service:
                    $ref: '#/components/schemas/Service'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/reports/summary:
    get:
      tags: [Admin]
      summary: 全站報表摘要（僅 Admin）
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 報表摘要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSummaryReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: 輸入驗證失敗
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 未登入 / token 無效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 權限不足
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 資源不存在或不可存取
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 商業規則衝突（名額不足/重複/非法狀態轉移/逾期等）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    RegisterRequest:
      type: object
      required: [email, password, role]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        role:
          type: string
          enum: [USER, PROVIDER]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    PasswordResetConfirmRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 8

    AuthResponse:
      type: object
      required: [user, accessToken, expiresAt]
      properties:
        user:
          $ref: '#/components/schemas/User'
        accessToken:
          type: string
        expiresAt:
          type: string
          format: date-time

    CreateBookingRequest:
      type: object
      required: [timeSlotId]
      properties:
        timeSlotId:
          type: string
          format: uuid

    CreateServiceRequest:
      type: object
      required: [name, description, durationMinutes]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        durationMinutes:
          type: integer
          minimum: 1

    UpdateServiceRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        durationMinutes:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/ServiceStatus'

    UpdateServiceStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/ServiceStatus'

    CreateTimeSlotRequest:
      type: object
      required: [startTime, endTime, capacity, cancelDeadlineAt]
      properties:
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        capacity:
          type: integer
          minimum: 1
        cancelDeadlineAt:
          type: string
          format: date-time

    UpdateTimeSlotRequest:
      type: object
      properties:
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        capacity:
          type: integer
          minimum: 1
        cancelDeadlineAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/TimeSlotStatus'

    UpdateUserStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/UserStatus'

    User:
      type: object
      required: [id, email, role, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        createdAt:
          type: string
          format: date-time

    Service:
      type: object
      required: [id, providerId, name, description, durationMinutes, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        providerId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        durationMinutes:
          type: integer
        status:
          $ref: '#/components/schemas/ServiceStatus'
        createdAt:
          type: string
          format: date-time

    TimeSlot:
      type: object
      required: [id, serviceId, startTime, endTime, capacity, bookedCount, remainingCapacity, status, cancelDeadlineAt]
      properties:
        id:
          type: string
          format: uuid
        serviceId:
          type: string
          format: uuid
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        capacity:
          type: integer
        bookedCount:
          type: integer
          minimum: 0
        remainingCapacity:
          type: integer
          minimum: 0
          description: 派生欄位（capacity - bookedCount）
        status:
          $ref: '#/components/schemas/TimeSlotStatus'
        cancelDeadlineAt:
          type: string
          format: date-time

    Booking:
      type: object
      required: [id, userId, timeSlotId, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        timeSlotId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/BookingStatus'
        createdAt:
          type: string
          format: date-time
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true

    AdminSummaryReport:
      type: object
      required: [totalBookings, cancellationRate, activeServicesCount, activeProvidersCount]
      properties:
        totalBookings:
          type: integer
          minimum: 0
        cancellationRate:
          type: number
          minimum: 0
          maximum: 1
          description: 0~1 之間的比率
        activeServicesCount:
          type: integer
          minimum: 0
        activeProvidersCount:
          type: integer
          minimum: 0

    ErrorResponse:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
          description: 穩定的錯誤代碼（供前端/維運判讀）
          example: CAPACITY_FULL
        message:
          type: string
          description: 使用者可理解且可行動的訊息
        requestId:
          type: string
          description: 追蹤用 request id
        details:
          type: object
          additionalProperties: true
          nullable: true

    UserRole:
      type: string
      enum: [USER, PROVIDER, ADMIN]

    UserStatus:
      type: string
      enum: [ACTIVE, SUSPENDED]

    ServiceStatus:
      type: string
      enum: [ACTIVE, INACTIVE]

    TimeSlotStatus:
      type: string
      enum: [OPEN, CLOSED]

    BookingStatus:
      type: string
      enum: [PENDING, CONFIRMED, CANCELLED, COMPLETED]
